<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coast FIRE Calculator — Kiko Tajada</title>
<meta name="description" content="Coast FIRE calculator: find the balance where you can stop saving and still retire on time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Styled to match kikotajada.com: Inter, warm paper background, gold accent */
:root{
  --bg:#fefdf8; --surface:#ffffff; --ink:#111111; --muted:#5a5a5a; --faint:#9a9a9a; --line:#e8e6df;
  --pine:#111111; --pine-soft:#e7f1ea; --ochre:#c48f00; --ochre-soft:#fdf4dc; --slate:#b3b1aa;
  --good:#2f7a4d;
  --display:'Inter', system-ui, -apple-system, sans-serif;
  --body:'Inter', system-ui, -apple-system, sans-serif;
  --mono:'Inter', system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-inline:1.5rem;padding-block:3.5rem 6rem;display:flex;flex-direction:column;gap:28px}
.page-head h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:0;margin:0;text-wrap:balance}
.page-head p{font-size:14px;margin:6px 0 0;color:var(--muted);max-width:62ch}
.site-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:.5rem}
.site-name{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.site-top nav{display:flex;gap:1.75rem;flex-wrap:wrap}
.site-top nav a{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-decoration:none;transition:color .15s}
.site-top nav a:hover,.site-top nav a.active{color:var(--ink)}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.lang button{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;border:0;background:transparent;color:var(--faint);padding:6px 12px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lang button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.back{font-size:13px;color:var(--muted);text-decoration:none}.back:hover{color:var(--ochre)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
.group-label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field label{font-weight:500;font-size:.92rem}
.field .hint{font-size:.78rem;color:var(--muted)}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;width:132px}
.num span{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding:0 8px}
.num input{border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:.9rem;padding:6px 8px;width:100%;text-align:right;min-width:0}
.num input:focus{outline:none}
.num:focus-within{border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-soft)}
input[type=range]{width:100%;accent-color:var(--pine)}
select{font-family:var(--body);font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.verdict{border-radius:14px;padding:22px 24px;background:var(--pine-soft);display:flex;flex-direction:column;gap:6px}
.verdict.pending{background:var(--ochre-soft)}
.verdict:not(.pending) .pill{background:var(--good)}
.pill{align-self:flex-start;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pine);color:var(--surface)}
.verdict.pending .pill{background:var(--ochre)}
.verdict h2{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3vw,1.9rem);margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.verdict p{margin:0;color:var(--ink);opacity:.85;max-width:64ch}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.75rem;color:var(--muted)}
.stat .v{font-family:var(--mono);font-weight:600;font-size:1.08rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:.72rem;color:var(--muted)}

.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px;min-width:0}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px;margin-bottom:6px}
.chart-head h3{margin:0;font-family:var(--display);font-weight:500;font-size:1.1rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart{width:100%;overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:520px}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}

.notes{font-size:.82rem;color:var(--muted);max-width:75ch;display:flex;flex-direction:column;gap:6px}
.notes b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="site-top">
    <a href="/" class="site-name">Kiko Tajada</a>
    <nav>
      <a href="/" data-i18n="nav_home">Home</a>
      <a href="/blog/">Blog</a>
      <a href="/contact/" data-i18n="nav_contact">Contact</a>
      <a href="/projects/" class="active" data-i18n="nav_projects">Projects</a>
    </nav>
  </div>
  <header class="page-head">
    <div class="head-row">
      <a href="/projects/" class="back" data-i18n="back">← Projects</a>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" id="lang_en" aria-pressed="true">EN</button>
        <button type="button" id="lang_es" aria-pressed="false">ES</button>
      </div>
    </div>
    <h1 data-i18n="title">Coast FIRE Calculator</h1>
    <p data-i18n="intro"></p>
  </header>

  <div class="grid">
    <form class="rail" id="form" autocomplete="off">
      <div class="field-top">
        <div class="group-label" data-i18n="g_ccy">Currency</div>
        <select id="ccy" aria-label="Currency">
          <option value="EUR" selected>EUR</option><option value="CHF">CHF</option><option value="USD">USD</option><option value="GBP">GBP</option>
        </select>
      </div>

      <div class="group-label" data-i18n="g_you">You</div>
      <div class="field"><div class="field-top"><label for="age" data-i18n="l_age">Current age</label><div class="num"><input id="age" type="number" min="16" max="80" value="32"><span data-i18n="u_yrs">yrs</span></div></div>
        <input type="range" id="age_r" min="16" max="80" value="32" aria-label="Current age"></div>
      <div class="field"><div class="field-top"><label for="ret" data-i18n="l_ret">Retirement age</label><div class="num"><input id="ret" type="number" min="30" max="80" value="60"><span data-i18n="u_yrs">yrs</span></div></div>
        <input type="range" id="ret_r" min="30" max="80" value="60" aria-label="Retirement age"></div>

      <div class="group-label" data-i18n="g_money">Money</div>
      <div class="field"><div class="field-top"><label for="bal" data-i18n="l_bal">Invested today</label><div class="num"><span class="cc">EUR</span><input id="bal" type="number" min="0" step="1000" value="120000"></div></div></div>
      <div class="field"><div class="field-top"><label for="contrib" data-i18n="l_contrib">Monthly saving</label><div class="num"><span class="cc">EUR</span><input id="contrib" type="number" min="0" step="100" value="2000"></div></div>
        <span class="hint" data-i18n="h_contrib"></span></div>
      <div class="field"><div class="field-top"><label for="spend" data-i18n="l_spend">Annual spending in retirement</label><div class="num"><span class="cc">EUR</span><input id="spend" type="number" min="0" step="1000" value="60000"></div></div>
        <span class="hint" data-i18n="h_spend"></span></div>

      <div class="group-label" data-i18n="g_assump">Assumptions</div>
      <div class="field"><div class="field-top"><label for="rr" data-i18n="l_rr">Investment return</label><div class="num"><input id="rr" type="number" min="0" max="15" step="0.1" value="7"><span data-i18n="u_pa">%/yr</span></div></div>
        <input type="range" id="rr_r" min="0" max="15" step="0.1" value="7" aria-label="Investment return">
        <span class="hint" data-i18n="h_rr"></span></div>
      <div class="field"><div class="field-top"><label for="inf" data-i18n="l_inf">Inflation</label><div class="num"><input id="inf" type="number" min="0" max="10" step="0.1" value="1.5"><span data-i18n="u_pa">%/yr</span></div></div>
        <input type="range" id="inf_r" min="0" max="10" step="0.1" value="1.5" aria-label="Inflation">
        <span class="hint" id="realhint"></span></div>
      <div class="field"><div class="field-top"><label for="swr" data-i18n="l_swr">Withdrawal rate</label><div class="num"><input id="swr" type="number" min="2" max="6" step="0.1" value="3.5"><span>%</span></div></div>
        <input type="range" id="swr_r" min="2" max="6" step="0.1" value="3.5" aria-label="Withdrawal rate"></div>
    </form>

    <section class="main" aria-live="polite">
      <div class="verdict" id="verdict">
        <span class="pill" id="pill"></span>
        <h2 id="headline">—</h2>
        <p id="sub"></p>
      </div>

      <div class="stats">
        <div class="stat"><span class="k" data-i18n="k_fire">FIRE number</span><span class="v" id="s_fire">—</span><span class="s" id="s_fire_s"></span></div>
        <div class="stat"><span class="k" data-i18n="k_coast">Coast number today</span><span class="v" id="s_coast">—</span><span class="s" data-i18n="s_coast"></span></div>
        <div class="stat"><span class="k" data-i18n="k_age">Coast age</span><span class="v" id="s_age">—</span><span class="s" data-i18n="s_age"></span></div>
        <div class="stat"><span class="k" data-i18n="k_stop">If you stop today</span><span class="v" id="s_stop">—</span><span class="s" id="s_stop_s"></span></div>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <h3><span data-i18n="c_title">Trajectory to retirement</span> <span style="font-size:.78rem;color:var(--muted);font-family:var(--body)" data-i18n="c_sub">in today's money</span></h3>
          <div class="legend">
            <span><i style="background:var(--pine)"></i><span data-i18n="lg_save"></span></span>
            <span><i style="background:var(--slate)"></i><span data-i18n="lg_stop"></span></span>
            <span><i style="background:var(--ochre)"></i><span data-i18n="lg_line"></span></span>
          </div>
        </div>
        <div class="chart" id="chart"></div>
      </div>

      <div class="notes">
        <span data-i18n="n_how"></span>
        <span data-i18n="n_money"></span>
        <span data-i18n="n_mind"></span>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  const T={
  en:{
    nav_home:"Home",nav_contact:"Contact",nav_projects:"Projects",back:"← Projects",
    title:"Coast FIRE Calculator",
    intro:"Find the balance where you can stop saving and let compounding carry you to financial independence. Enter your expected return and inflation separately; results are shown in today's money, with future-money figures alongside.",
    g_ccy:"Currency",g_you:"You",g_money:"Money",g_assump:"Assumptions",
    l_age:"Current age",l_ret:"Retirement age",u_yrs:"yrs",u_pa:"%/yr",
    l_bal:"Invested today",l_contrib:"Monthly saving",h_contrib:"Used to find when you hit Coast.",
    l_spend:"Annual spending in retirement",
    h_spend:"In <b style=\"color:var(--ink);font-weight:600\">today's prices</b>, what this lifestyle costs now. Don't inflate it yourself; the inflation input handles that. Net of any pension income you expect (state, workplace, etc.).",
    l_rr:"Investment return",h_rr:"Nominal, before inflation.",l_inf:"Inflation",l_swr:"Withdrawal rate",
    real:r=>"Real return: "+r+"%/yr (what actually compounds)",
    k_fire:"FIRE number",k_coast:"Coast number today",s_coast:"needed now to coast",k_age:"Coast age",s_age:"with monthly saving",k_stop:"If you stop today",
    fire_s:(v,y)=>"≈ "+v+" in "+y+" money",stop_s:(p,a)=>p+"% of FIRE number at "+a,now:"Now",
    c_title:"Trajectory to retirement",c_sub:"in today's money",
    lg_save:"Saving until Coast, then coasting",lg_stop:"Stop saving today",lg_line:"Coast line",
    coastAt:a=>"Coast @ "+a,
    n_how:"<b>How it works.</b> Real return = (1 + return) ÷ (1 + inflation) − 1. Coast number = FIRE number ÷ (1 + real return)<sup>years to retirement</sup>. The coast line rises each year because fewer years remain to compound. Where your savings path crosses it, you can stop contributing and still reach your FIRE number at retirement.",
    n_money:"<b>Today's money vs. future money.</b> Enter spending at today's prices. The calculator compounds at the real return, so every figure and the chart stay in today's money. The FIRE tile also shows the same target in retirement-year prices for reference. Entering an already-inflated spending figure would count inflation twice.",
    n_mind:"<b>Keep in mind.</b> Returns are smooth averages; real markets are not. A 3–3.5% withdrawal rate is a common conservative choice for early retirees. This is a planning aid, not financial advice.",
    p_done:"Coasted",h_done:"You've already reached Coast FIRE.",
    d_done:(b,f,a,x)=>"Your "+b+" grows to "+f+" by age "+a+" with no further saving, which is "+x+" more than you need. Any saving from here buys an earlier exit.",
    p_way:"On the way",h_way:a=>"You can stop saving at age "+a+".",
    d_way:(g,c,t,a)=>"You're "+g+" short of coasting today. Saving "+c+" a month closes the gap in about "+t+"; after that, cover only your living costs until "+a+".",
    months:n=>n+(n===1?" month":" months"),years:n=>n+" years",
    p_no:"Not reached",h_no:a=>"At this pace you don't reach Coast before "+a+".",
    d_no:(p,f)=>"You'd end up with "+p+" against a target of "+f+". Try saving more, retiring later, or lowering planned spending."
  },
  es:{
    nav_home:"Inicio",nav_contact:"Contacto",nav_projects:"Proyectos",back:"← Proyectos",
    title:"Calculadora Coast FIRE",
    intro:"Descubre con qué patrimonio puedes dejar de ahorrar y dejar que el interés compuesto te lleve a la independencia financiera. Introduce por separado la rentabilidad esperada y la inflación; los resultados se muestran en dinero de hoy, con las cifras en dinero futuro al lado.",
    g_ccy:"Moneda",g_you:"Tú",g_money:"Dinero",g_assump:"Supuestos",
    l_age:"Edad actual",l_ret:"Edad de jubilación",u_yrs:"años",u_pa:"%/año",
    l_bal:"Invertido hoy",l_contrib:"Ahorro mensual",h_contrib:"Sirve para calcular cuándo alcanzas el Coast.",
    l_spend:"Gasto anual en la jubilación",
    h_spend:"A <b style=\"color:var(--ink);font-weight:600\">precios de hoy</b>: lo que cuesta ese estilo de vida ahora. No le sumes la inflación; de eso se encarga el campo de inflación. Descuenta la pensión que esperes recibir (pública, de empresa, etc.).",
    l_rr:"Rentabilidad de la inversión",h_rr:"Nominal, antes de inflación.",l_inf:"Inflación",l_swr:"Tasa de retirada",
    real:r=>"Rentabilidad real: "+r+"%/año (la que realmente se capitaliza)",
    k_fire:"Número FIRE",k_coast:"Número Coast hoy",s_coast:"necesario ahora para dejar de ahorrar",k_age:"Edad Coast",s_age:"con el ahorro mensual",k_stop:"Si dejas de ahorrar hoy",
    fire_s:(v,y)=>"≈ "+v+" en dinero de "+y,stop_s:(p,a)=>p+"% del número FIRE a los "+a,now:"Ya",
    c_title:"Trayectoria hasta la jubilación",c_sub:"en dinero de hoy",
    lg_save:"Ahorrando hasta el Coast, luego sin aportar",lg_stop:"Dejar de ahorrar hoy",lg_line:"Línea Coast",
    coastAt:a=>"Coast a los "+a,
    n_how:"<b>Cómo funciona.</b> Rentabilidad real = (1 + rentabilidad) ÷ (1 + inflación) − 1. Número Coast = número FIRE ÷ (1 + rentabilidad real)<sup>años hasta la jubilación</sup>. La línea Coast sube cada año porque quedan menos años de capitalización. Cuando tu trayectoria de ahorro la cruza, puedes dejar de aportar y aun así llegar a tu número FIRE al jubilarte.",
    n_money:"<b>Dinero de hoy vs. dinero futuro.</b> Introduce el gasto a precios de hoy. La calculadora capitaliza a la rentabilidad real, así que todas las cifras y el gráfico están en dinero de hoy. La tarjeta FIRE también muestra el mismo objetivo a precios del año de jubilación como referencia. Si introduces un gasto ya inflado, contarías la inflación dos veces.",
    n_mind:"<b>Ten en cuenta.</b> Las rentabilidades son medias suavizadas; los mercados reales no lo son. Una tasa de retirada del 3–3,5% es una elección conservadora habitual para jubilaciones anticipadas. Es una herramienta de planificación, no asesoramiento financiero.",
    p_done:"Coast alcanzado",h_done:"Ya has alcanzado el Coast FIRE.",
    d_done:(b,f,a,x)=>"Tus "+b+" crecen hasta "+f+" a los "+a+" años sin ahorrar más, es decir, "+x+" más de lo que necesitas. Todo lo que ahorres a partir de ahora adelanta tu salida.",
    p_way:"En camino",h_way:a=>"Puedes dejar de ahorrar a los "+a+" años.",
    d_way:(g,c,t,a)=>"Te faltan "+g+" para alcanzar el Coast hoy. Ahorrando "+c+" al mes cierras la brecha en unos "+t+"; después, solo tienes que cubrir tus gastos hasta los "+a+".",
    months:n=>n+(n===1?" mes":" meses"),years:n=>n+" años",
    p_no:"No alcanzado",h_no:a=>"A este ritmo no alcanzas el Coast antes de los "+a+".",
    d_no:(p,f)=>"Acabarías con "+p+" frente a un objetivo de "+f+". Prueba a ahorrar más, jubilarte más tarde o reducir el gasto previsto."
  }};
  const $ = id => document.getElementById(id);
  let lang="en";
  try{const saved=localStorage.getItem("coastfire_lang"); lang=saved||((navigator.language||"").toLowerCase().startsWith("es")?"es":"en")}catch(e){lang=(navigator.language||"").toLowerCase().startsWith("es")?"es":"en"}
  const t=()=>T[lang];
  const dec=(v,d)=>{const s=v.toFixed(d);return lang==="es"?s.replace(".",","):s};

  function setLang(l){
    lang=l; document.documentElement.lang=l;
    try{localStorage.setItem("coastfire_lang",l)}catch(e){}
    $("lang_en").setAttribute("aria-pressed",l==="en"); $("lang_es").setAttribute("aria-pressed",l==="es");
    document.querySelectorAll("[data-i18n]").forEach(el=>{const v=t()[el.dataset.i18n]; if(typeof v==="string") el.innerHTML=v});
    document.title=t().title+" — Kiko Tajada";
    calc();
  }
  $("lang_en").addEventListener("click",()=>setLang("en"));
  $("lang_es").addEventListener("click",()=>setLang("es"));

  const pairs = [["age","age_r"],["ret","ret_r"],["rr","rr_r"],["inf","inf_r"],["swr","swr_r"]];
  pairs.forEach(([n,r])=>{
    $(r).addEventListener("input",()=>{$(n).value=$(r).value;calc()});
    $(n).addEventListener("input",()=>{$(r).value=$(n).value;calc()});
  });
  ["bal","contrib","spend"].forEach(id=>$(id).addEventListener("input",calc));
  $("ccy").addEventListener("change",()=>{document.querySelectorAll(".cc").forEach(e=>e.textContent=$("ccy").value);calc()});
  $("form").addEventListener("submit",e=>e.preventDefault());

  // Grouping follows the currency's home convention (CHF 1'250'000, EUR 1.250.000, USD 1,250,000)
  function fmt(v){
    const c=$("ccy").value, n=Math.round(v);
    const loc={CHF:"de-CH",EUR:"es-ES",USD:"en-US",GBP:"en-GB"}[c];
    return c+" "+n.toLocaleString(loc,{useGrouping:"always"});
  }
  function short(v){
    const a=Math.abs(v);
    if(a>=1e6) return dec(v/1e6,a>=1e7?0:1)+"M";
    if(a>=1e3) return Math.round(v/1e3)+"k";
    return String(Math.round(v));
  }
  const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:0};

  function calc(){
    const L=t();
    const age=num("age"), ret=Math.max(num("ret"),age+1), bal=Math.max(0,num("bal")),
          c=Math.max(0,num("contrib")), spend=Math.max(0,num("spend")),
          nom=num("rr")/100, inf=num("inf")/100, r=(1+nom)/(1+inf)-1, swr=Math.max(0.1,num("swr"))/100;
    const Y=ret-age, fire=spend/swr, g=1+r, m=Math.pow(g,1/12)-1;
    const coastAt = tt => fire/Math.pow(g, Y-tt);
    const coastNow = coastAt(0);

    const months=Math.round(Y*12);
    let p=bal, coastMonth = bal>=coastNow ? 0 : null;
    const save=[{t:0,v:bal}], stop=[], line=[];
    for(let i=1;i<=months;i++){
      p = p*(1+m) + (coastMonth===null ? c : 0);
      if(coastMonth===null && p>=coastAt(i/12)) coastMonth=i;
      if(i%12===0||i===months) save.push({t:i/12,v:p});
    }
    for(let tt=0;tt<=Y;tt+=Y>40?1:0.5){stop.push({t:tt,v:bal*Math.pow(g,tt)});line.push({t:tt,v:coastAt(tt)})}
    stop.push({t:Y,v:bal*Math.pow(g,Y)}); line.push({t:Y,v:fire});
    const stopFinal=bal*Math.pow(g,Y);

    $("realhint").textContent=L.real(dec(r*100,2));
    $("s_fire").textContent=fmt(fire);
    $("s_fire_s").textContent=L.fire_s(fmt(fire*Math.pow(1+inf,Y)), new Date().getFullYear()+Math.round(Y));
    $("s_coast").textContent=fmt(coastNow);
    $("s_stop").textContent=fmt(stopFinal);
    $("s_stop_s").textContent=L.stop_s(Math.round(stopFinal/fire*100),ret);

    const v=$("verdict");
    if(coastMonth===0){
      v.classList.remove("pending");
      $("pill").textContent=L.p_done; $("headline").textContent=L.h_done;
      $("sub").textContent=L.d_done(fmt(bal),fmt(stopFinal),ret,fmt(stopFinal-fire));
      $("s_age").textContent=L.now;
    } else if(coastMonth!==null){
      v.classList.add("pending");
      const ca=age+coastMonth/12, yrs=coastMonth/12;
      $("pill").textContent=L.p_way; $("headline").textContent=L.h_way(dec(ca,1));
      $("sub").textContent=L.d_way(fmt(coastNow-bal),fmt(c),yrs<1?L.months(Math.max(1,coastMonth)):L.years(dec(yrs,1)),ret);
      $("s_age").textContent=dec(ca,1);
    } else {
      v.classList.add("pending");
      $("pill").textContent=L.p_no; $("headline").textContent=L.h_no(ret);
      $("sub").textContent=L.d_no(fmt(p),fmt(fire));
      $("s_age").textContent="—";
    }
    draw(save,stop,line,Y,age,fire,coastMonth,r);
  }

  function draw(save,stop,line,Y,age,fire,coastMonth,r){
    const W=720,H=320,L=58,R=18,Tp=16,B=34, iw=W-L-R, ih=H-Tp-B;
    const maxV=Math.max(fire, ...save.map(d=>d.v), ...stop.map(d=>d.v))*1.08;
    const raw=maxV/5, mag=Math.pow(10,Math.floor(Math.log10(raw||1))), step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw);
    const top=Math.ceil(maxV/step)*step;
    const x=tt=>L+tt/Y*iw, y=v=>Tp+ih-(v/top)*ih;
    const path=a=>a.map((d,i)=>(i?"L":"M")+x(d.t).toFixed(1)+" "+y(d.v).toFixed(1)).join("");
    let g="";
    for(let v=0;v<=top+1e-6;v+=step){
      g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
      g+=`<text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
    }
    const xs=Y<=12?1:Y<=30?5:10;
    for(let tt=0;tt<=Y;tt+=xs){g+=`<text x="${x(tt)}" y="${H-12}" text-anchor="middle">${age+tt}</text>`}
    const area=path(save)+`L${x(Y)} ${y(0)}L${x(0)} ${y(0)}Z`;
    let marker="";
    if(coastMonth!==null){
      const ct=coastMonth/12, cv=fire/Math.pow(1+r,Y-ct);
      marker=`<line x1="${x(ct)}" x2="${x(ct)}" y1="${Tp}" y2="${y(0)}" stroke="var(--ochre)" stroke-dasharray="3 4"/>
        <circle cx="${x(ct)}" cy="${y(cv)}" r="5.5" fill="var(--surface)" stroke="var(--ochre)" stroke-width="2.5"/>
        <text x="${Math.min(x(ct)+8,W-R-90)}" y="${Tp+12}" style="fill:var(--ochre)">${t().coastAt(dec(age+ct,1))}</text>`;
    }
    const last=save[save.length-1];
    $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t().c_title}">
      ${g}
      <line x1="${L}" x2="${W-R}" y1="${y(fire)}" y2="${y(fire)}" stroke="var(--ochre)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>
      <text x="${W-R}" y="${y(fire)-6}" text-anchor="end" style="fill:var(--ochre)">FIRE ${short(fire)}</text>
      <path d="${area}" fill="var(--pine)" opacity=".06"/>
      <path d="${path(stop)}" fill="none" stroke="var(--slate)" stroke-width="2" stroke-dasharray="6 5"/>
      <path d="${path(line)}" fill="none" stroke="var(--ochre)" stroke-width="2.5"/>
      <path d="${path(save)}" fill="none" stroke="var(--pine)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.5" fill="var(--pine)"/>
      ${marker}
    </svg>`;
  }
  setLang(lang);
})();
</script>
</body>
